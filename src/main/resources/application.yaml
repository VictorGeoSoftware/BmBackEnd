ktor:
  deployment:
    port: 8081
    host: 0.0.0.0
  application:
    modules:
      - com.bm.backend.ApplicationKt.module

# Database configuration
# DB_VENDOR: "sqlite" (default) or "postgres"
# For SQLite: DB_URL overrides the default path (read in DatabaseFactory.kt)
# For Postgres: DB_URL, DB_USER, DB_PASSWORD must be set via environment variables
database:
  vendor: "sqlite"  # overridable via DB_VENDOR env var
  url: "jdbc:sqlite:price_tables.db"
  driver: "org.sqlite.JDBC"

# Security
# BM_ENCRYPTION_KEY must be set via environment variable (read in Application.kt)

# Rate limiting
rate_limit:
  enabled: true
  global_limit: 100
  window_seconds: 60

# Logging
logging:
  level: INFO
  org.jetbrains.exposed: INFO
