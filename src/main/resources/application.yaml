ktor:
  deployment:
    port: 8081
    host: 0.0.0.0
  application:
    modules:
      - com.bm.backend.ApplicationKt.module

# Database configuration (PostgreSQL)
# Required env vars: DB_URL, DB_USER, DB_PASSWORD
# Example: DB_URL=jdbc:postgresql://localhost:5432/bm_backend
database:
  driver: "org.postgresql.Driver"

# Security
# BM_ENCRYPTION_KEY must be set via environment variable (read in Application.kt)

# Rate limiting
rate_limit:
  enabled: true
  global_limit: 100
  window_seconds: 60

# Logging
logging:
  level: INFO
  org.jetbrains.exposed: INFO
