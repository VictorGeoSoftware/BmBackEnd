version: '3.8'

services:
  bm-backend:
    build: .
    container_name: bm-backend
    ports:
      - "8081:8081"
    volumes:
      - ./price_tables.db:/app/price_tables.db
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - KTOR_ENV=production
      - DOCLING_API_URL=http://host.docker.internal:5000
      - N8N_WEBHOOK_URL=http://host.docker.internal:5678/webhook/fetch-user-consumption
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bm-network

networks:
  bm-network:
    driver: bridge
