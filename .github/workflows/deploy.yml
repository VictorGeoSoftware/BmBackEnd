name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew clean shadowJar --no-daemon
      
      - name: Verify JAR was created
        run: |
          if [ ! -f build/libs/bm-backend-1.0-all.jar ]; then
            echo "Error: JAR file not found!"
            exit 1
          fi
          ls -lh build/libs/
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 217.154.181.175 >> ~/.ssh/known_hosts
      
      - name: Deploy to Server
        run: |
          # Create build/libs directory on server
          ssh root@217.154.181.175 "mkdir -p /root/BmBackEnd/build/libs"
          
          # Copy JAR to correct location
          scp build/libs/bm-backend-1.0-all.jar root@217.154.181.175:/root/BmBackEnd/build/libs/
          
          # Copy resources
          scp -r src/main/resources root@217.154.181.175:/root/BmBackEnd/
          
          # Restart service
          ssh root@217.154.181.175 "systemctl restart bm-backend"
          
          # Wait for service to start
          sleep 5
          
          # Check service status
          ssh root@217.154.181.175 "systemctl status bm-backend --no-pager"
      
      - name: Health Check
        run: |
          # Wait for application to be ready
          sleep 10
          
          # Test health endpoint
          curl -f http://217.154.181.175:8081/health || exit 1
          
          echo "✅ Deployment successful!"
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
          ssh root@217.154.181.175 "journalctl -u bm-backend -n 100 --no-pager" || true
