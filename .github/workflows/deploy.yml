name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

# The backend now runs as Docker containers (bm-backend-prod / bm-backend-qa)
# orchestrated by the BmInfra compose project on the VPS. This workflow pulls
# the latest code on the server and rebuilds the image there — no JAR is built
# on the runner, and no systemd units are touched anymore.

jobs:
  deploy:
    name: Deploy to VPS (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 217.154.181.175 >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          BM_AUTH_EMAIL_ALLOWLIST: ${{ secrets.BM_AUTH_EMAIL_ALLOWLIST }}
        run: |
          # Fail fast if the production allowlist is not configured. Without it the
          # backend boots with the allowlist DISABLED and would allow every account.
          if [ -z "${BM_AUTH_EMAIL_ALLOWLIST}" ]; then
            echo "::error::BM_AUTH_EMAIL_ALLOWLIST secret is empty. Add it in repo Settings -> Secrets and variables -> Actions (comma-separated emails) before deploying."
            exit 1
          fi

          # The secret may be multi-line (one email per line, possibly with
          # trailing commas). Normalize to a single comma-separated line —
          # embedded newlines would otherwise break the sed command below.
          ALLOWLIST=$(printf '%s' "${BM_AUTH_EMAIL_ALLOWLIST}" | tr '\n' ',' | tr -s ',' | sed 's/^,//; s/,$//')

          ssh root@217.154.181.175 "set -e
            echo '📦 Pulling latest BmBackEnd...'
            cd /opt/bm/BmBackEnd
            git fetch origin
            git reset --hard origin/main

            cd /opt/bm/BmInfra

            # Sync the allowlist from the GitHub secret (source of truth) into
            # the VPS .env consumed by docker compose.
            if grep -q '^BM_AUTH_EMAIL_ALLOWLIST=' .env; then
              sed -i 's|^BM_AUTH_EMAIL_ALLOWLIST=.*|BM_AUTH_EMAIL_ALLOWLIST=${ALLOWLIST}|' .env
            else
              echo 'BM_AUTH_EMAIL_ALLOWLIST=${ALLOWLIST}' >> .env
            fi

            echo '🐳 Rebuilding backend image...'
            docker compose build backend-prod

            echo '🔄 Recreating backend containers (PROD + QA share the image)...'
            docker compose up -d backend-prod backend-qa
          "

      - name: Health check
        run: |
          sleep 15

          echo "Checking PROD backend..."
          curl -f http://217.154.181.175:8081/health || exit 1

          echo "Checking QA backend..."
          curl -f http://217.154.181.175:9081/health || exit 1

          echo "✅ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Recent backend-prod logs:"
          ssh root@217.154.181.175 "cd /opt/bm/BmInfra && docker compose logs --tail=100 backend-prod" || true
