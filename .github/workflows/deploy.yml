name: Deploy

on:
  push:
    branches:
      - main   # -> PROD (bm/backend:prod, backend-prod container)
      - qa     # -> QA   (bm/backend:qa,   backend-qa container)
    # Documentation cannot affect the running service, so skip the rebuild and
    # container recreate for docs-only pushes. Without this, editing a README
    # restarts PROD and buries real deploys in noise. Use workflow_dispatch to
    # force a deploy regardless.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual trigger

# The backend now runs as Docker containers (bm-backend-prod / bm-backend-qa)
# orchestrated by the BmInfra compose project on the VPS. This workflow pulls
# the latest code on the server and rebuilds the image there — no JAR is built
# on the runner, and no systemd units are touched anymore.
#
# PROD and QA are fully decoupled: each branch deploys only its own image tag
# and container. PROD code lives in /opt/bm/BmBackEnd (main), QA code in
# /opt/bm/BmBackEnd-qa (qa branch).

jobs:
  deploy:
    name: Deploy to VPS (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 217.154.181.175 >> ~/.ssh/known_hosts

      - name: Deploy PROD on server
        if: github.ref == 'refs/heads/main'
        env:
          BM_AUTH_EMAIL_ALLOWLIST: ${{ secrets.BM_AUTH_EMAIL_ALLOWLIST }}
        run: |
          # Fail fast if the production allowlist is not configured. Without it the
          # backend boots with the allowlist DISABLED and would allow every account.
          if [ -z "${BM_AUTH_EMAIL_ALLOWLIST}" ]; then
            echo "::error::BM_AUTH_EMAIL_ALLOWLIST secret is empty. Add it in repo Settings -> Secrets and variables -> Actions (comma-separated emails) before deploying."
            exit 1
          fi

          # The secret may be multi-line (one email per line, possibly with
          # trailing commas). Normalize to a single comma-separated line —
          # embedded newlines would otherwise break the sed command below.
          ALLOWLIST=$(printf '%s' "${BM_AUTH_EMAIL_ALLOWLIST}" | tr '\n' ',' | tr -s ',' | sed 's/^,//; s/,$//')

          ssh root@217.154.181.175 "set -e
            echo '📦 Pulling latest BmBackEnd (main)...'
            cd /opt/bm/BmBackEnd
            git fetch origin
            git reset --hard origin/main

            cd /opt/bm/BmInfra

            # Sync the allowlist from the GitHub secret (source of truth) into
            # the VPS .env consumed by docker compose.
            if grep -q '^BM_AUTH_EMAIL_ALLOWLIST=' .env; then
              sed -i 's|^BM_AUTH_EMAIL_ALLOWLIST=.*|BM_AUTH_EMAIL_ALLOWLIST=${ALLOWLIST}|' .env
            else
              echo 'BM_AUTH_EMAIL_ALLOWLIST=${ALLOWLIST}' >> .env
            fi

            echo '🐳 Rebuilding PROD backend image (bm/backend:prod)...'
            docker compose build backend-prod

            echo '🔄 Recreating PROD backend container...'
            docker compose up -d backend-prod
          "

      - name: Deploy QA on server
        if: github.ref == 'refs/heads/qa'
        run: |
          ssh root@217.154.181.175 "set -e
            # QA gets its own checkout so the qa branch never touches the
            # main checkout used by PROD builds.
            if [ ! -d /opt/bm/BmBackEnd-qa ]; then
              echo '📥 Cloning BmBackEnd (qa branch) into /opt/bm/BmBackEnd-qa...'
              git clone -b qa https://github.com/VictorGeoSoftware/BmBackEnd.git /opt/bm/BmBackEnd-qa
            fi

            echo '📦 Pulling latest BmBackEnd (qa)...'
            cd /opt/bm/BmBackEnd-qa
            git fetch origin
            git reset --hard origin/qa

            cd /opt/bm/BmInfra

            echo '🐳 Rebuilding QA backend image (bm/backend:qa)...'
            docker compose build backend-qa

            echo '🔄 Recreating QA backend container...'
            docker compose up -d backend-qa
          "

      - name: Health check (PROD)
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 15
          echo "Checking PROD backend..."
          curl -f http://217.154.181.175:8081/health || exit 1
          echo "✅ PROD deployment successful!"

      - name: Health check (QA)
        if: github.ref == 'refs/heads/qa'
        run: |
          sleep 15
          echo "Checking QA backend..."
          curl -f https://api.qa.poweredbyadvisors.com/health || exit 1
          echo "✅ QA deployment successful!"

      - name: Notify on failure (PROD)
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          echo "❌ PROD deployment failed! Recent backend-prod logs:"
          ssh root@217.154.181.175 "cd /opt/bm/BmInfra && docker compose logs --tail=100 backend-prod" || true

      - name: Notify on failure (QA)
        if: failure() && github.ref == 'refs/heads/qa'
        run: |
          echo "❌ QA deployment failed! Recent backend-qa logs:"
          ssh root@217.154.181.175 "cd /opt/bm/BmInfra && docker compose logs --tail=100 backend-qa" || true
